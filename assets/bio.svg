<svg xmlns="http://www.w3.org/2000/svg" width="620" height="366" viewBox="0 0 620 366" role="img" aria-label="About Abdullah Khaled">
  <style>
    text { font-family: 'SF Mono','JetBrains Mono',Menlo,Consolas,'Yu Gothic','Hiragino Sans','Noto Sans CJK JP','Noto Sans JP',Meiryo,monospace; }
    .prompt { font-size: 15px; fill: #9ad4bd; }
    .key    { font-size: 15px; fill: #8fa2ef; }
    .value  { font-size: 15px; fill: #e8f3ee; }
    .title  { font-size: 12px; fill: #8b9a95; text-anchor: middle; }
    .cursor { fill: #9ad4bd; }
  </style>

  <!-- window frame -->
  <g id="window">
    <rect x=".5" y=".5" width="619" height="365" rx="14" fill="#0b1215" stroke="#9ad4bd" stroke-opacity=".22"/>
    <path d="M.5 40h619" stroke="#9ad4bd" stroke-opacity=".14"/>
  </g>

  <!-- title bar -->
  <g id="titlebar">
    <circle cx="24" cy="21" r="5" fill="#e07a6f"/>
    <circle cx="44" cy="21" r="5" fill="#e3c06b"/>
    <circle cx="64" cy="21" r="5" fill="#6fcf97"/>
    <text class="title" x="310" y="25">abdullahkhfb — about.sh</text>
  </g>

  <!-- typed lines: one group per row, revealed left to right in sequence -->
  <g id="rows">
    <g id="row-name">
      <clipPath id="reveal-name"><rect x="30" y="68" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="0.4s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-name)">
        <text class="prompt" x="34" y="86">›</text>
        <text class="key" x="56" y="86">name</text>
        <text class="value" x="160" y="86">abdullah khaled</text>
      </g>
    </g>
    <g id="row-alias">
      <clipPath id="reveal-alias"><rect x="30" y="104" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="1.7s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-alias)">
        <text class="prompt" x="34" y="122">›</text>
        <text class="key" x="56" y="122">alias</text>
        <text class="value" x="160" y="122">mugen · 無限 (limitless)</text>
      </g>
    </g>
    <g id="row-into">
      <clipPath id="reveal-into"><rect x="30" y="140" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="3.0s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-into)">
        <text class="prompt" x="34" y="158">›</text>
        <text class="key" x="56" y="158">into</text>
        <text class="value" x="160" y="158">low-level systems, in general</text>
      </g>
    </g>
    <g id="row-building">
      <clipPath id="reveal-building"><rect x="30" y="176" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="4.3s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-building)">
        <text class="prompt" x="34" y="194">›</text>
        <text class="key" x="56" y="194">building</text>
        <text class="value" x="160" y="194">browser extensions (for now)</text>
      </g>
    </g>
    <g id="row-likes">
      <clipPath id="reveal-likes"><rect x="30" y="212" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="5.6s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-likes)">
        <text class="prompt" x="34" y="230">›</text>
        <text class="key" x="56" y="230">likes</text>
        <text class="value" x="160" y="230">chess, algorithms, anime</text>
      </g>
    </g>
    <g id="row-knows">
      <clipPath id="reveal-knows"><rect x="30" y="248" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="6.9s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-knows)">
        <text class="prompt" x="34" y="266">›</text>
        <text class="key" x="56" y="266">knows</text>
        <text class="value" x="160" y="266">c · c++ · java · js · ts</text>
      </g>
    </g>
    <g id="row-tolerates">
      <clipPath id="reveal-tolerates"><rect x="30" y="284" width="0" height="26"><animate attributeName="width" from="0" to="560" dur="1.1s" begin="8.2s" fill="freeze"/></rect></clipPath>
      <g clip-path="url(#reveal-tolerates)">
        <text class="prompt" x="34" y="302">›</text>
        <text class="key" x="56" y="302">tolerates</text>
        <text class="value" x="160" y="302">python (knows it, not a fan)</text>
      </g>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect id="cursor" class="cursor" x="34" y="322" width="9" height="18"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
